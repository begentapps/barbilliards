<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar Billiards: The classic English pub game</title>
  <meta name="description" content="Bar Billiards: the classic English pub game in 3D. Pot balls, dodge the pegs, beat the clock.">
  <meta property="og:title" content="Bar Billiards">
  <meta property="og:description" content="The classic English pub game in 3D. Pot balls, dodge the pegs, beat the clock.">
  <meta property="og:image" content="images/feature-graphic.jpg">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <script>
    // Apply the saved or system theme before anything renders, so there's no flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <div id="app">Loading...</div>
  <script>
    (function () {
      var root = document.documentElement;
      var button = document.querySelector('.theme-toggle');
      var media = window.matchMedia('(prefers-color-scheme: dark)');

      function apply(theme) {
        root.setAttribute('data-theme', theme);
        var next = theme === 'dark' ? 'light' : 'dark';
        button.setAttribute('aria-label', 'Switch to ' + next + ' mode');
        button.setAttribute('title', 'Switch to ' + next + ' mode');
      }

      apply(root.getAttribute('data-theme') || (media.matches ? 'dark' : 'light'));

      button.addEventListener('click', function () {
        var theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(theme);
        try { localStorage.setItem('theme', theme); } catch (e) {}
      });

      // Follow the system setting until the visitor picks one themselves.
      var follow = function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) apply(e.matches ? 'dark' : 'light');
      };
      if (media.addEventListener) media.addEventListener('change', follow);
      else if (media.addListener) media.addListener(follow);
    })();
  </script>
  <script>
    window.$docsify = {
      name: '<img src="images/icon-256.png" alt="" class="sidebar-icon"> Bar Billiards',
      nameLink: '#/',
      coverpage: true,
      onlyCover: false,
      loadSidebar: true,
      subMaxLevel: 2,
      maxLevel: 3,
      auto2top: true,
      themeColor: '#2f7d3a',
      search: {

        depth: 3
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
</body>
</html>
